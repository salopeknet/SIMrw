# Thin wrapper around the shared Python-Crosscompiler-One4All workflow
# (salopeknet/myTools, public). Only SIMrw's own deltas from the defaults
# live here - everything generic lives in myTools.

name: Python-Crosscompiler-One4All 5.0 (SIMrw)

on:
  workflow_dispatch:
    inputs:
      releasetag:
        description: 'Release Tag (Version)'
        type: string
        required: true
        default: '0.0.0'
      macos:
        description: 'Build for macOS'
        type: boolean
        default: true
      windows:
        description: 'Build for Windows'
        type: boolean
        default: true
      linux:
        description: 'Build for Linux'
        type: boolean
        default: false
      onedir:
        description: 'Compile one-directory'
        type: boolean
        default: false
      onefile:
        description: 'Compile one-file'
        type: boolean
        default: true

jobs:
  build:
    permissions:
      contents: write
    uses: salopeknet/myTools/.github/workflows/crosscompilerMS.yml@main
    with:
      scriptname: SIMrw
      releasetag: ${{ inputs.releasetag }}
      macos: ${{ inputs.macos }}
      windows: ${{ inputs.windows }}
      linux: ${{ inputs.linux }}
      onedir: ${{ inputs.onedir }}
      onefile: ${{ inputs.onefile }}
      linux_apt_packages: "libpcsclite-dev python3-all-dev python3-setuptools swig"
